name: Claude Code

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # --- pick ONE auth method ---
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # Pro/Max
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}             # API key

          # --- triggers ---
          trigger_phrase: "@claude"          # default; comment/mention trigger
          assignee_trigger: "claude-bot"      # assigning the issue to this username triggers Claude
          label_trigger: "claude"             # adding this label also triggers Claude
